[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kzclimate"
version = "1.0.0"
description = "Климат Алматы и Астаны с 1940 года: тренды, аномалии и экстремумы по реанализу ERA5"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Medet Kabdulinov" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/mkbdlnv/kz-climate"
Dashboard = "https://climate.mkab.dev"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["kzclimate"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
